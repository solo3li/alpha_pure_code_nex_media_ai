{% load static %}
{% load i18n %}
{% get_current_language as CURRENT_LANG %}
<!DOCTYPE html>
<html lang="{{ CURRENT_LANG }}" dir="{% if CURRENT_LANG == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-M3QMV7SP');</script>
  <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tool_name|title }} {% trans "History" %} - NEX MEDIA AI</title>
    <link rel="stylesheet" href="{% static 'history/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    {% if CURRENT_LANG == 'ar' %}
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap">
    {% endif %}
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M3QMV7SP"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  
    <div class="background-overlay"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <i class="fas fa-history nav-icon"></i>
                <span class="nav-title">{{ tool_name|title }} {% trans "History" %}</span>
            </div>
            <button type="button" class="upgrade-btn" onclick="window.location.href='/#container-sub'">
                <i class="fas fa-bolt"></i>
                <span>{% trans "Upgrade" %}</span>
            </button>
        </div>
    </nav>
    
    <div class="main-content">
        <div class="page-header">
            <h1>{% trans "History" %}</h1>
            <p>{% trans "Your previously processed images" %}</p>
        </div>
        
        <div class="history-grid" id="history">
            <!-- User's history will be populated here -->
        </div>
    </div>
    
    <script>
        window.__HISTORY_TRANS = {
            noHistory: "{% trans 'No History Found' %}",
            noHistoryDesc: "{% trans 'You have not processed any files with this tool yet.' %}",
            download: "{% trans 'Download' %}"
        };
        const toolName = "{{ tool_name }}";

        document.addEventListener("DOMContentLoaded", function() {
            fetch(`{% url 'history:get_history' %}?tool_name=${toolName}`)
                .then(response => response.json())
                .then(data => {
                    let historyDiv = document.getElementById('history');
                    
                    if (data.length === 0) {
                        historyDiv.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">
                                    <i class="fas fa-history"></i>
                                </div>
                                <h3>${window.__HISTORY_TRANS.noHistory}</h3>
                                <p>${window.__HISTORY_TRANS.noHistoryDesc}</p>
                            </div>
                        `;
                        return;
                    }
                    
                    data.forEach(item => {
                        let div = document.createElement('div');
                        div.classList.add('history-item');

                        let imageContainer = document.createElement('div');
                        imageContainer.classList.add('image-container');
                        
                        let img = document.createElement('img');
                        img.src = item.file_path;
                        img.alt = item.file_name;
                        img.loading = 'lazy';

                        imageContainer.appendChild(img);

                        let contentContainer = document.createElement('div');
                        contentContainer.classList.add('item-content');

                        let fileName = document.createElement('h4');
                        fileName.classList.add('item-title');
                        fileName.textContent = item.file_name;

                        let dateProcessed = new Date(item.processed_date);
                        let dateTime = document.createElement('p');
                        dateTime.classList.add('item-date');
                        dateTime.innerHTML = `
                            <i class="fas fa-calendar"></i>
                            ${dateProcessed.toLocaleDateString()}
                        `;
                        
                        let time = document.createElement('p');
                        time.classList.add('item-time');
                        time.innerHTML = `
                            <i class="fas fa-clock"></i>
                            ${dateProcessed.toLocaleTimeString()}
                        `;

                        contentContainer.appendChild(fileName);
                        contentContainer.appendChild(dateTime);
                        contentContainer.appendChild(time);

                        let downloadButton = document.createElement('a');
                        downloadButton.href = item.file_path;
                        downloadButton.download = item.file_name;
                        downloadButton.innerHTML = `
                            <i class="fas fa-download"></i>
                            <span>${window.__HISTORY_TRANS.download}</span>
                        `;
                        downloadButton.classList.add('download-btn');

                        div.appendChild(imageContainer);
                        div.appendChild(contentContainer);
                        div.appendChild(downloadButton);
                        historyDiv.appendChild(div);
                    });
                });
        });
    </script>
</body>
</html>
