{% extends 'auth/base_auth.html' %}

{% block title %}Password Reset Complete - NexMediaAI{% endblock %}

{% block content %}
<div class="auth-header text-center">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1>Password Reset Complete!</h1>
    <p class="mb-4">Your password has been successfully reset. You can now login with your new password.</p>
</div>

<a href="/login" class="btn btn-primary w-100 mb-3">
    <i class="fas fa-sign-in-alt me-2"></i>Login Now
</a>

<div class="divider">
    <span>or</span>
</div>

<a href="{% url 'google_login' %}" class="btn-google">
    <i class="fab fa-google"></i>
    Continue with Google
</a>
{% endblock %}
