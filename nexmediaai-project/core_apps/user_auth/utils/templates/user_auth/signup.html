{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-M3QMV7SP');</script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NEX MEDIA AI</title>
    <link rel="stylesheet" href="{% static 'user_auth/css/signup/signUP.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M3QMV7SP"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  
    <div class="background-overlay"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-robot"></i>
                    </div>
                    <h1>NEX MEDIA AI</h1>
                    <p>Join the AI revolution</p>
                </div>
                
                <div class="auth-toggle">
                    <div class="toggle-background" id="btns"></div>
                    <button type="button" class="toggle-btn">
                        <a href="/login/">Login</a>
                    </button>
                    <button type="button" class="toggle-btn active">SignUp</button>
                </div>
            </div>

            <div class="auth-form-section">
                <form method="post" action="{% url 'signup' %}" class="auth-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            Username
                        </label>
                        <input class="form-input" type="text" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i>
                            Email Address
                        </label>
                        <input class="form-input" type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password1">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <div class="password-input-wrapper">
                            <input class="form-input" type="password" id="password1" name="password1" placeholder="Create a password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password1')">
                                <i class="fas fa-eye" id="password1-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password2">
                            <i class="fas fa-lock"></i>
                            Confirm Password
                        </label>
                        <div class="password-input-wrapper">
                            <input class="form-input" type="password" id="password2" name="password2" placeholder="Confirm your password" required>
                            <button type="button" class="password-toggle" onclick="togglePassword('password2')">
                                <i class="fas fa-eye" id="password2-icon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country">
                            <i class="fas fa-globe"></i>
                            Country
                        </label>
                        <input class="form-input" type="text" id="country" name="country" placeholder="Enter your country" required>
                    </div>

                    <button type="submit" class="submit-btn">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>or</span>
                </div>

                <a href="{% url 'google_login' %}" class="google-btn">
                    <i class="fab fa-google"></i>
                    Continue with Google
                </a>
            </div>
        </div>
    </div>

    <!-- Modern Popup -->
    <div id="popup" class="modern-popup">
        <div class="popup-content">
            <div class="popup-icon">
                <i class="fas fa-check-circle success-icon"></i>
                <i class="fas fa-exclamation-circle error-icon"></i>
            </div>
            <div class="popup-message" id="popup-message"></div>
            <button class="popup-close-btn" onclick="closePopup()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script>
        function togglePassword(inputId) {
            const passwordInput = document.getElementById(inputId);
            const passwordIcon = document.getElementById(inputId + '-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }

        function showPopup(message, type = 'error') {
            const popup = document.getElementById("popup");
            const popupMessage = document.getElementById("popup-message");
            const successIcon = popup.querySelector('.success-icon');
            const errorIcon = popup.querySelector('.error-icon');
            
            popupMessage.textContent = message;
            
            if (type === 'error') {
                successIcon.style.display = 'none';
                errorIcon.style.display = 'block';
                popup.classList.add('error');
                popup.classList.remove('success');
            } else {
                successIcon.style.display = 'block';
                errorIcon.style.display = 'none';
                popup.classList.add('success');
                popup.classList.remove('error');
            }
            
            popup.classList.add('show');
            
            setTimeout(() => {
                popup.classList.remove('show');
            }, 7000);
        }

        function closePopup() {
            document.getElementById("popup").classList.remove('show');
        }

        // Show Django messages
        document.addEventListener("DOMContentLoaded", function() {
            {% if messages %}
                {% for message in messages %}
                    showPopup("{{ message }}", "{{ message.tags }}");
                {% endfor %}
            {% endif %}
        });
    </script>
</body>
</html>
