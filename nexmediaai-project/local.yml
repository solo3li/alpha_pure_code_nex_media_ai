services:
    api: &api
        build:
            context: .
            dockerfile: ./docker/local/django/Dockerfile

        volumes:
            - .:/app:z
            - ./staticfiles:/app/staticfiles
            - ./media:/app/media  # Map media directory for shared access

        expose:
            - "8000"

        env_file:
            - ./.env/.env.local

        depends_on:
            - postgres
            # - mailpit
            # - redis
            # - rabbitmq

        command: /start.sh

        networks:
            - banker_local_nw
        environment:
            - FLASK_VIDEO_BG_REMOVER_URL=http://video_bg_remover:5001




    postgres:
        build:
            context: .
            dockerfile: ./docker/local/postgres/Dockerfile
        ports:
            - "5432:5432"
        volumes:
            - banker_local_db:/var/lib/postgresql/data
            - ./backups:/backups
        env_file:
            - ./.env/.env.local
        networks:
            - banker_local_nw

    mailpit:
        image: docker.io/axllent/mailpit:v1.20.3
        ports:
            - "8025:8025"
            - "1025:1025"
        volumes:
            - banker_mailpit_db:/data
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATA_FILE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - banker_local_nw
   
    redis:
        image: redis:7.0-alpine3.19

        command:
            [
            "redis-server",
            "--appendonly", "yes",
            "--protected-mode", "no",
            "--requirepass", "asfgbadfhybsdfxgvadrv",
            "--rename-command", "REPLICAOF", ""
            ]

        networks:
            - banker_local_nw

        environment:
            - REDIS_PASSWORD=asfgbadfhybsdfxgvadrv



    rabbitmq:
        image: rabbitmq:3-management
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
            - rabbitmq_log:/var/log/rabbitmq
        networks:
            - banker_local_nw

    celeryworker:
        <<: *api
        command: /start-celeryworker.sh

    flower:
        <<: *api
        ports:
            - "5555:5555"
        volumes:
            - flower_db:/app/flower_db
        command: /start-flower.sh

    celerybeat:
        build:
            context: .
            dockerfile: ./docker/local/django/Dockerfile
        command: /start-celerybeat.sh
        env_file:
            - ./.env/.env.local
        depends_on:
            - redis
            - postgres
            - rabbitmq
        networks:
            - banker_local_nw

    nginx:
        build:
            context: ./docker/local/nginx
            dockerfile: Dockerfile
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./staticfiles:/app/staticfiles
            - ./media:/app/media  # Map media directory for shared access
            - logs_store:/var/log/nginx
            - ./demos:/app/demos:ro  # Voice demo MP3s for /voice-demos/ route
        depends_on:
            - api
        networks:
            - banker_local_nw

    redisinsight:
        image: redis/redisinsight:latest
        ports:
            - "5540:5540"
        volumes:
            - redisinsight_data:/data
        environment:
            - RI_APP_HOST=0.0.0.0
        networks:
            - banker_local_nw
        depends_on:
            - redis
 

    # redis-commander:
    #     image: rediscommander/redis-commander:latest
    #     ports:
    #         - "8081:8081"
    #     environment:
    #         - REDIS_HOSTS=local:redis:6379
