    orchestrator:
        build:
            context: .
            dockerfile: ./docker/local/flask/orchestrator/Dockerfile
        container_name: vm-orchestrator
        volumes:
            - ./services/orchestrator:/app:z
        env_file:
            - ./.env/.env.local
        ports:
            - "5550:5550"  # Changed from expose to ports for external access
        networks:
            - banker_local_nw
        environment:
            - FLASK_ENV=production
            - REDIS_URL=redis://redis:6379/0
        depends_on:
            - redis
        restart: unless-stopped

