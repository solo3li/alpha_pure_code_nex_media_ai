    bg_remover:
        build:
            context: .
            dockerfile: ./docker/local/flask/bg-remover/Dockerfile
        volumes:
            - ./services/bg_remover:/app:z
            - ./media/history/bg_remover:/tmp/processed   
            - bg_remover_uploads:/tmp/uploads
        env_file:
            - ./.env/.env.local
        expose:
            - "5000"
        networks:
            - banker_local_nw
        environment:
            - FLASK_ENV=production
    
    gpt:
        build:
            context: .
            dockerfile: ./docker/local/flask/GPT/Dockerfile
        container_name: gpt-flask-api
        volumes:
            - ./services/GPT:/app:z
            - bg_remover_uploads:/tmp/uploads
        env_file:
            - ./.env/.env.local
        expose:
            - "5007"
        networks:
            - banker_local_nw
        environment:
            - FLASK_ENV=production
        command: [
            "gunicorn",
            "--bind", "0.0.0.0:5007",
            "--workers", "4",
            "--timeout", "1000",
            "--access-logfile", "-",
            "app:app"
                ]
            
