name: Docker Publish

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./nexmediaai-project
          file: ./nexmediaai-project/docker/production/django/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexmediaai-api:latest

      - name: Build and push Postgres image
        uses: docker/build-push-action@v5
        with:
          context: ./nexmediaai-project
          file: ./nexmediaai-project/docker/production/postgres/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexmediaai-postgres:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nexmediaai-project/docker/production/nginx
          file: ./nexmediaai-project/docker/production/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexmediaai-nginx:latest
