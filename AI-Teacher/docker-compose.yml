version: '3.8'

services:
  ai-teacher:
    build: .
    container_name: ai-spanish-teacher
    ports:
      - "2222:2222"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      # Mount temp directory for audio files
      - ./temp:/app/temp
      # Mount static files for development (optional)
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped

    networks:
      - ai-teacher-network


networks:
  ai-teacher-network:
    external: true
