events {
    worker_connections 1024;
}

http {
    upstream ai_teacher {
        server ai-teacher:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Increase client body size for audio uploads
        client_max_body_size 10M;

        location / {
            proxy_pass http://ai_teacher;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (if needed in future)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeout settings for audio processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Serve static files directly
        location /static/ {
            proxy_pass http://ai_teacher/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Serve audio files with proper headers
        location /temp/ {
            proxy_pass http://ai_teacher/temp/;
            add_header Content-Type audio/mpeg;
            add_header Cache-Control "no-cache";
        }
    }
}
