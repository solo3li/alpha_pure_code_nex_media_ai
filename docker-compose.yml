version: '3.8'

services:
  ai-teacher:
    build: .
    container_name: ai-spanish-teacher
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      # Mount temp directory for audio files
      - ./temp:/app/temp
      # Mount static files for development (optional)
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-teacher-network

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: ai-teacher-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-teacher
    restart: unless-stopped
    networks:
      - ai-teacher-network
    profiles:
      - production

networks:
  ai-teacher-network:
    driver: bridge

volumes:
  temp_audio:
    driver: local
